<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>白菜影院|最纯净的视频站</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;900&display=swap" rel="stylesheet">
    <style>
        :root {
            /* 全局背景变量修改为纯白色，适配亮色主题 */
            --bg: #ffffff;
            --primary: #2563eb;
            /* 半透玻璃组件调整为适配白背景的浅透明白色 */
            --glass: rgba(241, 245, 249, 0.7);
            /* 边框调整为浅灰色，适配亮色环境不突兀 */
            --border: rgba(2, 6, 23, 0.08);
            /* 主文本调整为深暗色，保证白背景下可读性 */
            --text-main: #020617;
            /* 次要文本调整为柔和深灰，降低视觉压力 */
            --text-dim: #475569;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            /* 基础背景读取更新后的白色变量 */
            background: var(--bg); 
            color: var(--text-main); 
            font-family: 'Noto Sans SC', sans-serif; 
            /* 移除原本深色模式的暗紫色径向渐变，替换为适配白背景的极浅淡渐变，保留视觉层次感 */
            background-image: radial-gradient(circle at 50% -20%, #e0e7ff 0%, #ffffff 70%);
            margin: 0;
            min-height: 100vh;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

        /* 顶部导航修正 */
        nav { 
            height: 80px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }
        /* Logo颜色调整为适配白背景的深灰，保证清晰可见 */
        .nav-logo { font-size: 12px; font-weight: 900; color: #475569; letter-spacing: 0.3em; }

        /* 搜索框区域适配亮色主题 */
        .search-section { max-width: 600px; margin: 80px auto; text-align: center; }
        /* 标题渐变调整为适配白背景的深色调渐变，不会在白背景下隐形 */
        h1 { font-size: clamp(2rem, 8vw, 3.5rem); font-weight: 900; margin-bottom: 40px; background: linear-gradient(180deg, #020617 30%, #64748b 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .search-bar { 
            display: flex; 
            background: var(--glass); 
            backdrop-filter: blur(20px); 
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 6px;
            transition: 0.3s;
        }
        .search-bar:focus-within { border-color: var(--primary); box-shadow: 0 0 25px rgba(37, 99, 235, 0.2); }
        
        /* 输入框适配亮色背景 */
        input#kw { 
            flex: 1;
            background: transparent !important;
            border: none !important;
            outline: none !important;
            padding: 12px 20px;
            /* 输入文字改为深色，白背景下可清晰输入 */
            color: #020617 !important;
            font-size: 16px;
            appearance: none;
        }

        /* 修复 Chrome 自动填充在白背景下的显示问题 */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus {
            /* 自动填充文字改为深色，适配白背景 */
            -webkit-text-fill-color: #020617 !important;
            -webkit-box-shadow: 0 0 0px 1000px #f8fafc inset !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        .btn-go { 
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 14px;
            padding: 0 30px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-go:hover { background: #3b82f6; transform: scale(1.02); }

        /* 影片展示网格 */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); 
            gap: 25px; 
            margin-top: 40px;
        }

        .movie-card { cursor: pointer; transition: 0.3s; }
        .movie-card:hover { transform: translateY(-8px); }
        .poster { 
            aspect-ratio: 2/3; 
            /* 海报背景调整为浅灰色，适配白背景不突兀 */
            background: #f1f5f9;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            border: 1px solid var(--border);
        }
        .poster img { width: 100%; height: 100%; object-fit: cover; }
        .remarks { position: absolute; bottom: 0; left: 0; right: 0; padding: 10px; background: linear-gradient(transparent, rgba(255,255,255,0.9)); font-size: 10px; color: #1e293b; }
        .m-title { margin-top: 10px; font-weight: bold; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* 播放视图 */
        .player-view { display: none; padding-bottom: 100px; animation: fadeInUp 0.5s ease; }
        .player-header { display: flex; justify-content: space-between; margin-bottom: 20px; color: var(--text-dim); font-size: 14px; }
        .back-btn { cursor: pointer; color: #475569; font-weight: bold; }
        .back-btn:hover { color: #020617; }

        .player-container { display: grid; grid-template-columns: 1fr; gap: 30px; }
        @media (min-width: 1024px) { .player-container { grid-template-columns: 3fr 1fr; } }

        .main-stage { background: #000; border-radius: 24px; overflow: hidden; aspect-ratio: 16/9; position: relative; border: 1px solid var(--border); }
        iframe { position: absolute; width: 100%; height: 100%; border: none; }

        /* 剧集列表展示 */
        /*.side-bar { background: var(--glass); border-radius: 24px;*/

        .side-bar { background: var(--glass); border-radius: 24px; padding: 20px; border: 1px solid var(--border); }
        .ep-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; max-height: 500px; overflow-y: auto; padding-right: 5px; }
        .ep-item { background: #ffffff; border: 1px solid var(--border); padding: 10px; border-radius: 10px; font-size: 12px; cursor: pointer; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .ep-item:hover { border-color: var(--primary); color: var(--primary); }
        .active-ep { background: var(--primary); color: white; border-color: var(--primary); }

        .hidden { display: none; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        footer { border-top: 1px solid var(--border); padding: 50px 0; margin-top: 100px; text-align: center; color: #475569; font-size: 12px; }
    </style>
</head>
<body>

<div class="container">
    <nav>
        <div class="nav-logo">白菜影视</div>
        <div class="nav-logo" style="color: #475569;">4K高清·纯净无广</div>
    </nav>

    <main id="mainContent">
        <section id="searchSection" class="search-section">
            <h1>全网查询·一搜即看</h1>
            <div class="search-bar">
                <input type="text" id="kw" placeholder="输入影片关键词..." autocomplete="off">
                <button onclick="doSearch()" class="btn-go">搜索</button>
            </div>
            <div id="status" style="margin-top:15px; font-size:10px; color:#3b82f6; letter-spacing:2px; font-weight:900;"></div>
        </section>
        <div id="results" class="grid"></div>

        <div id="playerView" class="player-view">
            <div class="player-header">
                <div class="back-btn" onclick="location.reload()">← 返回搜索</div>
                <div id="vFrom" style="color:#3b82f6; font-weight:900;">来源加载中...</div>
            </div>
            <div class="player-container">
                <div class="video-side">
                    <div class="main-stage">
                        <iframe id="playFrame" allowfullscreen="true"></iframe>
                    </div>
                    <h2 id="vTitle" style="margin: 20px 0 10px;"></h2>
                    <div id="vContent" style="color:#64748b; font-size:14px; line-height:1.6;"></div>
                </div>
                <div class="side-bar">
                    <p style="font-size:10px; font-weight:900; color:#475569; margin-bottom:15px;">PLAYLIST / 播放列表</p>
                    <div id="epList" class="ep-grid"></div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        &copy; 2026  
    </footer>
</div>

<script>
    const API_URL = "/bcys/api.php";
    const JX_INTERFACE = "https://svip.ffzyplay.com/?url=";

    async function doSearch() {
        const kw = document.getElementById('kw').value.trim();
        if(!kw) return;
        document.getElementById('status').innerText = "正在扫描全球资源节点...";
        const resDiv = document.getElementById('results');
        resDiv.innerHTML = "";

        try {
            const resp = await fetch(`${API_URL}?wd=${encodeURIComponent(kw)}`);
            const data = await resp.json();
            document.getElementById('status').innerText = `找到 ${data.list.length} 条资源`;

            data.list.forEach((item) => {
                const card = document.createElement('div');
                card.className = "movie-card";
                card.onclick = () => openPlayer(item);
                card.innerHTML = `
                    <div class="poster">
                        <img src="${item.vod_pic}" loading="lazy">
                        <div class="remarks">${item.vod_remarks}</div>
                    </div>
                    <div class="m-title">${item.vod_name}</div>
                    <div style="font-size:9px; color:#3b82f6; font-weight:900; margin-top:4px;">${item.from}</div>
                `;
                resDiv.appendChild(card);
            });
        } catch (e) { document.getElementById('status').innerText = "连接接口失败"; }
    }

    function openPlayer(vod) {
        document.getElementById('searchSection').classList.add('hidden');
        document.getElementById('results').classList.add('hidden');
        document.getElementById('playerView').style.display = 'block';
        document.getElementById('vTitle').innerText = vod.vod_name;
        document.getElementById('vFrom').innerText = "来源: " + vod.from;
        document.getElementById('vContent').innerText = vod.vod_content ? vod.vod_content.replace(/<[^>]+>/g, '').substring(0, 150) + "..." : "暂无详情。";

        const epList = document.getElementById('epList');
        epList.innerHTML = "";
        
        let playUrlRaw = vod.vod_play_url;
        if (playUrlRaw.includes('$$$')) {
            playUrlRaw = playUrlRaw.split('$$$').find(l => l.includes('m3u8')) || playUrlRaw.split('$$$')[0];
        }
                
        const eps = playUrlRaw.split('#').filter(x => x.includes('$'));
        eps.forEach((ep, i) => {
            const [name, url] = ep.split('$');
            const item = document.createElement('div');
            item.className = "ep-item";
            item.innerText = name;
            item.onclick = () => {
                document.getElementById('playFrame').src = JX_INTERFACE + encodeURIComponent(url.trim());
                document.querySelectorAll('.ep-item').forEach(b => b.classList.remove('active-ep'));
                item.classList.add('active-ep');
            };
            epList.appendChild(item);
            if(i === 0) item.click();
        });
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
</script>
</body>
</html>

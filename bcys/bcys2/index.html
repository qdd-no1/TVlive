
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>白菜影视</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #111827;
            color: #fff;
        }
        .section-grid {
            display: grid;
            gap: 1rem;
            grid-template-columns: repeat(auto-fill, minmax(130px,1fr));
        }
        @media(min-width:768px){
            .section-grid{
                grid-template-columns: repeat(auto-fill, minmax(180px,1fr));
            }
        }
        #player-modal > div{
            width:100%;
            max-width:1200px;
        }
        /* ===== 全屏模式布局修复：确保视频与进度条完整显示 ===== */
        #player-modal > div:fullscreen,
        #player-modal > div:-webkit-full-screen {
            max-width: none;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 0;
            margin: 0;
        }
        /* 全屏时视频区域弹性填充剩余空间 */
        #player-modal > div:fullscreen .player-wrap,
        #player-modal > div:-webkit-full-screen .player-wrap {
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* 全屏时视频按原始比例缩放，不超出可用区域 */
        #player-modal > div:fullscreen #main-player,
        #player-modal > div:-webkit-full-screen #main-player {
            width: auto;
            height: auto;
            max-width: 100%;
            max-height: 100%;
            aspect-ratio: auto;
        }
        #main-player{
            width:100%;
            height:auto;
            aspect-ratio:16/9;
        }
        /* 播放器容器相对定位，用于跑马灯/广告悬浮 */
        .player-wrap{
            position: relative;
            overflow: hidden;
            cursor: pointer; /* 视频画面可点击切换播放/暂停 */
        }
        /* 视频上方跑马灯 */
        .video-marquee-box{
            position: absolute;
            top: 8px;
            left: 0;
            width: 100%;
            overflow: hidden;
            z-index: 10;
            pointer-events: none; /* 不阻挡鼠标操作视频控件 */
        }
        /* 全屏时跑马灯位置微调（宽度仍为容器100%，即整屏宽） */
        #player-modal > div:fullscreen .video-marquee-box,
        #player-modal > div:-webkit-full-screen .video-marquee-box{
            top: 14px;
        }
        /*
         * 滚动载体：宽度=容器宽度（100%），translateX 的百分比基于自身宽度计算，
         * 与视口(vw/vh)无关，因此在原生全屏下也能正确跨屏滚动，不会丢失。
         */
        .video-marquee-inner {
            display: inline-block;
            width: 100%;
            white-space: nowrap;
            transform: translateX(100%);
            opacity: 0;
            will-change: transform, opacity;
        }
        /* JS 触发时添加该类，执行一次滚动 */
        .video-marquee-inner.scrolling {
            animation: marqueeScroll 12s linear;
        }
        @keyframes marqueeScroll {
            0%   { transform: translateX(100%);  opacity: 1; }
            95%  { transform: translateX(-100%);  opacity: 1; }
            100% { transform: translateX(-100%);  opacity: 0; }
        }
        /* 跑马灯仅按视频时间点触发一次滚动（全屏时同样按时间点触发，不循环） */
        .video-marquee-text {
            white-space: nowrap;
            font-size: 22px;
            font-weight: bold;
            color: #ff3333;
            background: transparent;
            text-shadow: 2px 2px 4px #000000;
            display: inline-block;
        }
        /* ===== 自制广告覆盖层 ===== */
        .ad-overlay{
            position: absolute;
            inset: 0;
            z-index: 15;
            background: #000;
            display: none;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .ad-overlay .ad-player{
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        .ad-msg{
            text-align: center;
            padding: 0 20px;
        }
        .ad-msg-title{
            font-size: 40px;
            font-weight: 900;
            color: #ffd400;
            margin-bottom: 14px;
        }
        .ad-msg-text{
            font-size: 26px;
            color: #fff;
            margin-bottom: 10px;
        }
        .ad-msg-sub{
            font-size: 16px;
            color: #94a3b8;
        }
        .ad-badge{
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 2;
            background: #ff2d2d;
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            padding: 3px 10px;
            border-radius: 4px;
        }
        .ad-countdown{
            position: absolute;
            bottom: 16px;
            right: 16px;
            z-index: 2;
            background: rgba(0,0,0,.55);
            color: #fff;
            font-size: 14px;
            padding: 5px 12px;
            border-radius: 16px;
        }
        .ad-skip-btn{
            position: absolute;
            bottom: 16px;
            left: 16px;
            z-index: 2;
            background: rgba(255,255,255,.92);
            color: #111;
            border: none;
            padding: 8px 18px;
            border-radius: 18px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            display: none;
        }
        .ad-skip-btn:hover{ background: #fff; }
        .poster-card:hover .type-badge{
            transform: translateY(0);
            opacity: 1;
        }
        .hidden {
            display: none !important;
        }
        #detail-modal, #player-modal {
            display: none;
        }
        .episode-btn.active {
            background-color: #2563eb;
            color:#fff;
        }
        /* 页面顶部跑马灯动画 */
        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        .marquee-text{
            animation: marquee 25s linear infinite;
            white-space: nowrap;
            font-size: 24px;
            font-weight: 900;
            color: red;
            background-color: transparent;
            line-height: 1.5;
            padding: 10px 0;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
        }
        /* 图片抗模糊优化 */
        img{
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }
        .poster-img{
            width:100%;
            aspect-ratio:2/3;
            object-fit:cover;
            border-radius:8px;
            background:#222;
        }
        /* 版块样式 */
        .section-wrap{
            margin-bottom:3rem;
        }
        .section-header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:1rem;
            border-left:4px solid #3b82f6;
            padding-left:12px;
        }
        /* 分页按钮样式 */
        .page-btn{
            padding:6px 12px;
            border-radius:6px;
            background:#374151;
            color:#fff;
        }
        .page-btn:hover:not(.disabled){
            background:#3b82f6;
        }
        .page-btn.disabled{
            opacity:0.4;
            cursor:not-allowed;
        }
        .page-btn.active{
            background:#3b82f6;
        }
    </style>
</head>
<body class="min-h-screen">
    <!-- Hero轮播区域 -->
    <section id="hero-section" class="relative h-[50vh] md:h-[70vh] overflow-hidden hidden">

                    </select>
                </div>
                <!-- 动画分类下拉 -->

        </div>
        <!-- 分版块渲染容器 -->

    </div>
    <!-- 详情弹窗 -->

    <!-- 播放器弹窗 -->
    <div id="player-modal" class="fixed inset-0 bg-black z-[999] flex items-center justify-center p-2">

                </div>

            <!-- 播放器外层容器，用于跑马灯/广告悬浮 -->
            <div class="player-wrap">
                <!-- 视频画面上方跑马灯 -->
                <div class="video-marquee-box">
                    <div class="video-marquee-inner">
                        <div class="video-marquee-text">白菜影视资源来源于网络，请勿用于非法用途！仅供学习测试使用，侵权请联系删除！欢迎植根心田！</div>
                    </div>
                </div>
                <!-- 自制广告覆盖层：插播时覆盖在主视频上方，播完自动隐藏并恢复主视频 -->

                    <div id="ad-msg" class="ad-msg hidden">
                        <div class="ad-msg-title">广告时间</div>
                        <div id="ad-msg-text" class="ad-msg-text"></div>
                        <div class="ad-msg-sub">本广告为页面内自制广告，仅供演示</div>
                    </div>
                    <video id="ad-player" class="ad-player" playsinline preload="auto"></video>
                    <div class="ad-badge">广告</div>
                    <div class="ad-countdown">广告剩余 <span id="ad-remain">0</span> 秒</div>
                    <button id="ad-skip-btn" class="ad-skip-btn">跳过广告</button>
                </div>
                <video id="main-player" controls controlsList="nofullscreen"></video>
            </div>
            <div class="flex justify-center gap-4 mt-3">
                <button id="prev-ep-btn" class="px-4 py-2 bg-gray-700 rounded"><i class="fa fa-chevron-left"></i> 上一集</button>
                <button onclick="app.toggleFullScreen()" class="px-4 py-2 bg-gray-700 rounded"><i class="fa fa-expand"></i> 全屏</button>
                <button id="next-ep-btn" class="px-4 py-2 bg-gray-700 rounded">下一集 <i class="fa fa-chevron-right"></i></button>
            </div>
        </div>
    </div>
<script>
const app = {
    state: {
        // 改为：每个分类独立保存页码

            tv:1,

            anime:1,
            live:1

        subCategory: '',
        searchQuery: '',
        sortBy: 'newest',
        data: [],
        currentPlayingItem: null,
        currentEpisodeIndex: 0,
        episodeList: [],
        currentHeroId: null,
        hlsInstance: null,
        currentDetailItem: null,
        heroCarouselList: [],
        heroCarouselIndex: 0,
        heroCarouselTimer: null,
        /* ---- 视频跑马灯状态 ---- */
        marqueePoints: [600, 1800, 2400], // 10分钟、30分钟、40分钟（秒）
        marqueeTriggered: {},
            // 记录每个时间点是否已触发
        marqueeInitialShown: false,        // 开播时首次滚动是否已显示
        /* ---- 自制广告配置 ----
         * at:       广告插入点（秒）：2分钟=120，15分钟=900，42分钟=2520
         * duration: 广告时长（秒），如需按示例插入 1 分钟广告，把对应 duration 改为 60
         * text:     自制广告显示文案（自动生成广告视频时使用）
         * src:      留空则自动生成自制广告视频；如需使用自己的广告视频文件，填视频 URL 或相对路径
         */
        ads: [
            /*{ at: 120,  duration: 8, text: '白菜影视提醒您：南旺龙王庙分水枢纽欢迎您，精彩节目马上继续', src: '' },*/

            /*{ at: 2520, duration: 8, text: '白菜影视提醒您：南旺分水枢纽遗址欢迎你', src: '' }*/
        ],
        adTriggered: {},       // 记录每个插入点是否已插播
        adPreloaded: {},       // 记录广告视频是否已预加载
        adUrls: {},            // 插入点 -> 广告视频地址（空字符串表示走页面内兜底广告）
        adActive: false,       // 当前是否正在播放广告
        adVideoEndTimer: null, // 广告结束安全兜底定时器
        domAdTimer: null,      // 页面内兜底广告的倒计时定时器
        promotingFullscreen: false // 原生视频全屏提升为播放器全屏的防重入标记
    },
    mockData : [
    {
        "id": 1,
        "title": "花开锦绣",
        "mainType": "tv",
        "subCategory": "内地剧",
        "updateTime": 1789433127270,
        "year": "2026",
        "rating": 9.3,
        "views": 1200500,

        document.addEventListener('fullscreenchange', () => this.onFullscreenChange());
        document.addEventListener('webkitfullscreenchange', () => this.onFullscreenChange());
        /* ---- 跳过广告按钮 ---- */
        const adSkipBtn = document.getElementById('ad-skip-btn');
        if (adSkipBtn) {
            adSkipBtn.onclick = () => this.finishAd();
        }
        /* ---- 预生成并准备自制广告视频（页面加载即开始，不阻塞播放） ---- */
        this.prepareAds();
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                this.closePlayer();
                this.closeDetailModal();
            }
        });
        const prevBtn = document.getElementById('prev-ep-btn');
        const nextBtn = document.getElementById('next-ep-btn');
        if(prevBtn){
            prevBtn.onclick = ()=>{
                if(this.state.currentEpisodeIndex > 0){
                    this.loadEpisode(this.state.currentEpisodeIndex - 1);
                }
            }
        }
        if(nextBtn){
            nextBtn.onclick = ()=>{
                if(this.state.currentEpisodeIndex < this.state.episodeList.length -1){
                    this.loadEpisode(this.state.currentEpisodeIndex + 1);
                }
            }
        }
        const heroSection = document.getElementById('hero-section');
        if (heroSection) {
            heroSection.addEventListener('mouseenter', () => this.stopHeroCarousel());
            heroSection.addEventListener('mouseleave', () => this.startHeroCarousel());
        }

        const marqueeInner = document.querySelector('.video-marquee-inner');
        if (marqueeInner) {
            marqueeInner.addEventListener('animationend', () => {
                marqueeInner.classList.remove('scrolling');
            });

         * 底部原生控制栏（进度条/播放按钮/音量等）不拦截，保留原生行为。
         */
        const mainPlayerEl = document.getElementById('main-player');
        if (mainPlayerEl) {
            mainPlayerEl.addEventListener('click', (e) => this.togglePlayOnSurfaceClick(e), true);
        }
    },
    // 切换版块页码
    changeSectionPage(sectionKey, pageNum){
        this.state.pageMap[sectionKey] = pageNum;
        this.renderMultiSection();
        window.scrollTo({top:0,behavior:'smooth'});
    },
    /* ============ 视频跑马灯控制 ============ */
    /**
     * 重置跑马灯触发状态（每次加载新视频/新集数时调用）
     */
    resetMarquee() {
        this.state.marqueeTriggered = {};
        this.state.marqueeInitialShown = false;
        const inner = document.querySelector('.video-marquee-inner');
        if (inner) {
            inner.classList.remove('scrolling');
        }
    },
    /**
     * 主动触发一次跑马灯滚动（全屏时同样按时间点触发，不循环）
     */
    triggerMarquee() {
        const inner = document.querySelector('.video-marquee-inner');
        if (!inner) return;
        // 强制重排，确保连续触发时动画能重新播放
        inner.classList.remove('scrolling');
        void inner.offsetWidth;
        inner.classList.add('scrolling');
    },
    /**
     * 点击视频画面：播放中点击 -> 暂停；暂停中点击 -> 播放。
     * 仅在"画面区域"生效：底部原生控制栏区域（进度条/播放按钮/音量等）
     * 不拦截，保留原生行为；广告播放期间不响应。
     */
    togglePlayOnSurfaceClick(e) {
        const player = document.getElementById('main-player');
        if (!player) return;
        // 广告播放期间不响应画面点击
        if (this.state.adActive) return;
        // 判断点击是否落在底部原生控件区域
        const rect = player.getBoundingClientRect();
        if (!rect || !rect.height) return;
        const y = e.clientY - rect.top;
        const isFs = this.isFullscreen();
        const controlBand = isFs ? 200 : Math.max(64, rect.height * 0.12);
        if (y > rect.height - controlBand) return; // 控件区域交给原生处理
        // 画面区域：拦截原生行为（如暂停态中心播放按钮），自行切换播放/暂停
        if (e.preventDefault) e.preventDefault();
        if (e.stopPropagation) e.stopPropagation();
        if (player.paused) {
            player.play().catch(err => console.log('点击画面播放失败:', err));
        } else {
            player.pause();
        }
    },
    /**
     * 全屏状态切换：跑马灯不自动循环，仅按视频时间点触发（全屏时同样按时间点正常滚动显示）。
     * 兜底：主视频已加 controlsList="nofullscreen"，原生全屏入口被移除，统一走
     * 播放器容器全屏（跑马灯在容器内可见）；若个别浏览器仍触发视频元素原生全屏，
     * 这里会自动提升为整个播放器全屏，保证跑马灯不被浏览器丢弃。
     */
    onFullscreenChange() {
        const player = document.getElementById('main-player');
        const fsEl = document.fullscreenElement || document.webkitFullscreenElement;
        // 场景A：用户点击了视频自带的原生全屏按钮（全屏的是 <video> 本身，兄弟节点的跑马灯会消失）
        if (fsEl === player && !this.state.promotingFullscreen) {
            this.state.promotingFullscreen = true;
            const container = document.querySelector('#player-modal > div');
            const tryExit = document.exitFullscreen ? document.exitFullscreen.bind(document)
                            : (document.webkitExitFullscreen ? document.webkitExitFullscreen.bind(document) : null);
            const doRequest = () => {
                try {
                    if (container.requestFullscreen) container.requestFullscreen();
                    else if (container.webkitRequestFullscreen) container.webkitRequestFullscreen();
                } catch(e) {}
                setTimeout(() => { this.state.promotingFullscreen = false; }, 200);
            };
            if (tryExit) {
                Promise.resolve(tryExit()).then(doRequest).catch(() => {
                    this.state.promotingFullscreen = false;
                });
            } else {
                this.state.promotingFullscreen = false;
            }
            return;
        }
        // 场景B：进入/退出播放器容器全屏 —— 跑马灯状态保持不变，
        // 仍只按视频时间点触发一次滚动（不会因全屏而循环或丢失）
    },
    isFullscreen() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement);
    },
    /**
     * 视频 timeupdate 回调：检测跑马灯时间点 + 广告插入点 + 广告预加载
     */
    onMainPlayerTimeUpdate() {
        const player = document.getElementById('main-player');
        if (!player || !player.currentTime) return;
        const t = player.currentTime;
        // 跑马灯仅按时间点触发一次（全屏与非全屏行为一致，不自动循环）
        this.state.marqueePoints.forEach(pt => {
            if (t >= pt && !this.state.marqueeTriggered[pt]) {
                this.state.marqueeTriggered[pt] = true;
                this.triggerMarquee();
            }
        });
        // 广告插播触发
        if (this.state.adActive) return;
        const item = this.state.currentPlayingItem;
        if (item && item.mainType === 'live') return; // 直播不适合插播，跳过
        this.state.ads.forEach(ad => {
            if (!this.state.adTriggered[ad.at] && t >= ad.at) {
                this.state.adTriggered[ad.at] = true;
                this.playAd(ad);
            }
        });
        // 预加载下一个即将到来的广告（提前30秒），保证插播时零等待
        this.ensureAdPreload();
    },
    /* ============ 自制广告插播控制 ============ */
    /**
     * 页面加载时并行生成/准备全部广告视频（Canvas+MediaRecorder 实时录制，无需外部素材）
     */
    async prepareAds() {
        const tasks = this.state.ads.map(async (ad) => {
            let url = '';
            if (ad.src) {
                url = ad.src; // 用户自备广告视频
            } else {
                url = (await this.createSelfMadeAdVideo(ad)) || '';
            }
            this.state.adUrls[ad.at] = url;
        });
        await Promise.all(tasks);
    },
    /**
     * 用 Canvas 实时绘制并录制一段自制广告视频（WebM/MP4 Blob，本地生成、无网络依赖）
     * 返回 objectURL；浏览器不支持时返回 null，播放端自动走页面内兜底广告
     */
    async createSelfMadeAdVideo(ad) {
        try {
            if (typeof MediaRecorder === 'undefined' || !HTMLCanvasElement.prototype.captureStream) return null;
            const canvas = document.createElement('canvas');
            canvas.width = 1280;
            canvas.height = 720;
            const ctx = canvas.getContext('2d');
            const stream = canvas.captureStream(30);
            const mime = ['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4;codecs=avc1']
                .find(m => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m));
            if (!mime) return null;
            const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 1000000 });
            const chunks = [];
            rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
            const done = new Promise(resolve => {
                rec.onstop = () => resolve(new Blob(chunks, { type: mime }));
            });
            rec.start(250);
            const start = performance.now();
            const draw = (now) => {
                const t = (now - start) / 1000;
                if (t >= ad.duration) { rec.stop(); return; }
                // 渐变背景
                const g = ctx.createLinearGradient(0, 0, 1280, 720);
                g.addColorStop(0, '#101828');
                g.addColorStop(1, '#1e3a8a');
                ctx.fillStyle = g;
                ctx.fillRect(0, 0, 1280, 720);
                // 动态装饰圆
                const cx = 180 + ((t * 70) % 900);
                ctx.fillStyle = 'rgba(255,212,0,0.14)';
                ctx.beginPath();
                ctx.arc(cx, 170, 120, 0, Math.PI * 2);
                ctx.fill();
                // 品牌
                ctx.fillStyle = '#ffd400';
                ctx.font = 'bold 56px "PingFang SC","Microsoft YaHei",sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('白菜影视 ', 640, 210);
                // 主文案
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 38px "PingFang SC","Microsoft YaHei",sans-serif';
                ctx.fillText(ad.text, 640, 330);
                // 副文案
                ctx.fillStyle = '#cbd5e1';
                ctx.font = '26px "PingFang SC","Microsoft YaHei",sans-serif';
                ctx.fillText('广告剩余 ' + Math.max(1, Math.ceil(ad.duration - t)) + ' 秒，马上回到正片', 640, 420);
                // 进度条
                ctx.fillStyle = 'rgba(255,255,255,0.25)';
                ctx.fillRect(240, 470, 800, 6);
                ctx.fillStyle = '#ffd400';
                ctx.fillRect(240, 470, 800 * Math.min(1, t / ad.duration), 6);
                // 底部版权
                ctx.fillStyle = '#94a3b8';
                ctx.font = '20px "PingFang SC","Microsoft YaHei",sans-serif';
                ctx.fillText('影视资源来源于网络，仅供学习测试使用，侵权请联系删除', 640, 660);
                requestAnimationFrame(draw);
            };
            requestAnimationFrame(draw);
            const blob = await done;
            return URL.createObjectURL(blob);
        } catch (e) {
            console.warn('生成自制广告视频失败，将使用页面内兜底广告：', e);
            return null;
        }
    },
    /**
     * 提前预加载即将插入的广告视频（提前30秒），确保到点插播时零等待、不卡顿
     */
    ensureAdPreload() {
        const player = document.getElementById('main-player');
        if (!player) return;
        const t = player.currentTime;
        this.state.ads.forEach(ad => {
            if (this.state.adTriggered[ad.at]) return;
            if (t >= ad.at - 30 && t < ad.at && this.state.adUrls[ad.at] && !this.state.adPreloaded[ad.at]) {
                this.state.adPreloaded[ad.at] = true;
                const adVideo = document.getElementById('ad-player');
                if (adVideo) {
                    adVideo.src = this.state.adUrls[ad.at];
                    adVideo.load();
                }
            }
        });
    },
    /**
     * 在指定插入点插播广告：
     * 1. 主视频精确停在插入点（currentTime=at 并暂停，播放位置被完整保留）
     * 2. 广告（已预加载）立即从 0 开始播放，衔接无停顿
     * 3. 广告播完/被跳过 -> 主视频从原插入点继续播放
     */
    playAd(ad) {
        if (this.state.adActive) return;
        const player = document.getElementById('main-player');
        const overlay = document.getElementById('ad-overlay');
        const adVideo = document.getElementById('ad-player');
        const adRemain = document.getElementById('ad-remain');
        const adMsg = document.getElementById('ad-msg');
        const url = this.state.adUrls[ad.at];
        this.state.adActive = true;
        // 主视频精确停在插入点（暂停后 currentTime 保留，广告结束从这里续播）
        player.currentTime = ad.at;
        player.pause();
        // 显示广告覆盖层
        overlay.style.display = 'flex';
        document.getElementById('ad-skip-btn').style.display = 'inline-block';
        adRemain.textContent = ad.duration;
        if (url) {
            // 方式一：播放真实的广告视频（已预加载的本地自制广告或用户自备广告）
            adMsg.classList.add('hidden');
            adVideo.style.display = 'block';
            adVideo.src = url;
            adVideo.currentTime = 0;
            const startAd = () => {
                adVideo.play().catch(e => console.log('广告自动播放被拦截:', e));
                adVideo.ontimeupdate = () => {
                    adRemain.textContent = Math.max(0, Math.ceil(ad.duration - adVideo.currentTime));
                };
                adVideo.onended = () => this.finishAd();
            };
            if (adVideo.readyState >= 2) {
                startAd();
            } else {
                adRemain.textContent = '加载中';
                adVideo.oncanplay = () => startAd();
            }
            // 安全兜底：万一 ended 事件丢失，到时强制结束广告恢复正片
            this.state.adVideoEndTimer = setTimeout(() => this.finishAd(), (ad.duration + 3) * 1000);
        } else {
            // 方式二：页面内兜底广告（浏览器不支持生成广告视频时使用，同样连续衔接）
            adVideo.style.display = 'none';
            adMsg.classList.remove('hidden');
            document.getElementById('ad-msg-text').textContent = ad.text;
            adRemain.textContent = ad.duration;
            const start = Date.now();
            this.state.domAdTimer = setInterval(() => {
                const remain = ad.duration - (Date.now() - start) / 1000;
                adRemain.textContent = Math.max(0, Math.ceil(remain));
                if (remain <= 0) this.finishAd();
            }, 200);
        }
    },
    /**
     * 广告播放结束/被跳过：隐藏广告层，主视频从插入点无缝继续播放
     */
    finishAd() {
        if (!this.state.adActive) return;
        this.state.adActive = false;
        clearTimeout(this.state.adVideoEndTimer);
        clearInterval(this.state.domAdTimer);
        const overlay = document.getElementById('ad-overlay');
        const adVideo = document.getElementById('ad-player');
        overlay.style.display = 'none';
        adVideo.pause();
        adVideo.removeAttribute('src');
        adVideo.load();
        document.getElementById('ad-skip-btn').style.display = 'none';
        const player = document.getElementById('main-player');
        // 主视频停在插入点，直接继续播放
        player.play().catch(e => console.log('广告结束恢复播放失败:', e));
    },
    /**
     * 重置广告插播状态（每次加载新视频/新集数时调用）
     */
    resetAds() {
        this.state.adTriggered = {};
        this.state.adPreloaded = {};
        this.state.adActive = false;
        clearTimeout(this.state.adVideoEndTimer);
        clearInterval(this.state.domAdTimer);
        const overlay = document.getElementById('ad-overlay');
        if (overlay) overlay.style.display = 'none';
        const adVideo = document.getElementById('ad-player');
        if (adVideo) {
            adVideo.pause();
            adVideo.removeAttribute('src');
            adVideo.load();
        }
        const skip = document.getElementById('ad-skip-btn');
        if (skip) skip.style.display = 'none';
    },
    startHeroCarousel() {

    },

    // 新版：分版块渲染
    renderMultiSection(){
        const container = document.getElementById('multi-section-container');
        container.innerHTML = '';
        const sectionMap = [
            {key:'movie',title:'🎬 电影'},
            {key:'tv',title:'📺 电视剧'},
            {key:'variety',title:'🎙️ 综艺'},
            {key:'anime',title:'🎞️ 动画'},
            {key:'live',title:'📡 直播'}
        ];
        let totalAll = 0;
        sectionMap.forEach(sec=>{
            // 筛选当前版块数据
            let secData = this.state.data.filter(item=>{
                const matchMain = this.state.currentFilter === 'all' || item.mainType === this.state.currentFilter;
                const matchType = item.mainType === sec.key;
                const matchSub = !this.state.subCategory || item.subCategory === this.state.subCategory;
                const matchSearch = item.title.toLowerCase().includes(this.state.searchQuery.toLowerCase());
                return matchMain && matchType && matchSub && matchSearch;
            });
            if(secData.length <=0) return;
            totalAll += secData.length;
            // 排序
            secData.sort((a, b) => {
                if (this.state.sortBy === 'newest') return b.updateTime - a.updateTime;
                if (this.state.sortBy === 'rating') return b.rating - a.rating;
                if (this.state.sortBy === 'views') return b.views - a.views;
                return 0;
            });
            // 获取当前版块页码
            const currentPage = this.state.pageMap[sec.key];
            const start = (currentPage - 1) * this.state.itemsPerPage;
            const end = start + this.state.itemsPerPage;
            const pageItems = secData.slice(start, end);
            const totalPages = Math.ceil(secData.length / this.state.itemsPerPage);
            // 构建版块HTML
            let sectionHtml = `<div class="section-wrap">
                <div class="section-header">
                    <h2 class="text-xl font-bold text-white">${sec.title}</h2>
                    <span class="text-gray-400 text-sm">共${secData.length}部</span>
                </div>
                <div class="section-grid">`;
            pageItems.forEach(item=>{
                sectionHtml += this.renderCard(item);
            });
            sectionHtml += `</div>`;
            // 渲染分页栏（大于1页才显示）
            if(totalPages > 1){
                sectionHtml += `
                <div class="flex flex-wrap justify-center gap-2 mt-4">
                    <button onclick="app.changeSectionPage('${sec.key}',${currentPage-1})" class="page-btn ${currentPage<=1?'disabled':''}" ${currentPage<=1?'disabled':''}>上一页</button>
                `;
                // 页码按钮
                for(let p=1;p<=totalPages;p++){
                    // 只渲染附近页码，防止页码太多
                    if(p === 1 || p === totalPages || (p >= currentPage-1 && p <= currentPage+1)){
                        sectionHtml += `<button onclick="app.changeSectionPage('${sec.key}',${p})" class="page-btn ${p===currentPage?'active':''}">${p}</button>`;
                    }else if(p === currentPage-2 || p === currentPage+2){
                        sectionHtml += `<span class="px-2">...</span>`;
                    }
                }
                sectionHtml += `
                    <button onclick="app.changeSectionPage('${sec.key}',${currentPage+1})" class="page-btn ${currentPage>=totalPages?'disabled':''}" ${currentPage>=totalPages?'disabled':''}>下一页</button>
                </div>`;
            }
            sectionHtml += `</div>`;
            container.innerHTML += sectionHtml;
        });
        document.getElementById('total-count').innerText = totalAll;
        if(totalAll === 0){
            container.innerHTML = `<div class="col-span-full flex flex-col items-center justify-center py-12 text-gray-500"><i class="fa fa-search text-4xl mb-4"></i><p>没有找到相关视频</p></div>`;
        }
    },
    openDetailModal(id) {
        const item = this.state.data.find(i => i.id === id);
        if (!item) return;
        this.state.currentDetailItem = item;
        const modal = document.getElementById('detail-modal');
        document.getElementById('detail-poster').src = item.poster;
        document.getElementById('detail-poster').alt = `${item.title}海报`;
        document.getElementById('detail-title').innerText = item.title;
        document.getElementById('detail-rating').innerText = `⭐ ${item.rating}`;
        document.getElementById('detail-year').innerText = item.year;
        let typeText = '';
        switch(item.mainType){
            case 'movie': typeText = '电影'; break;
            case 'tv': typeText = '电视剧'; break;
            case 'variety': typeText = '综艺'; break;
            case 'anime': typeText = '动画'; break;
            case 'live': typeText = '直播'; break;
            default: typeText = '影视';
        }
        document.getElementById('detail-type').innerText = typeText;
        document.getElementById('detail-views').innerText = this.formatNumber(item.views);
        document.getElementById('detail-plot').innerText = item.plot;
        document.getElementById('detail-cast').innerText = item.cast;
        const status = this.getSeriesStatus(item);
        const statusBadge = document.getElementById('detail-status-badge');
        if (status.text) {
            statusBadge.innerText = status.text;
            statusBadge.className = `absolute top-4 left-4 px-3 py-1 rounded text-xs font-bold text-white shadow-lg ${status.className}`;
            statusBadge.style.display = 'block';
        } else {
            statusBadge.style.display = 'none';
        }
        const episodesSection = document.getElementById('episodes-section');
        const episodesGrid = document.getElementById('episodes-grid');
        episodesGrid.innerHTML = '';
        if ((item.mainType === 'tv' || item.mainType === 'variety' || item.mainType === 'anime') && item.episodeUrls && item.episodeUrls.length > 0) {
            episodesSection.classList.remove('hidden');
            item.episodeUrls.forEach((url, index) => {
                const btn = document.createElement('button');
                btn.className = 'episode-btn bg-gray-700 border border-gray-600 text-gray-300 py-2 px-1 rounded text-sm hover:text-white';
                btn.innerText = index + 1;
                btn.onclick = () => {
                    this.checkPasswordAndPlay(item.id, index);
                };
                episodesGrid.appendChild(btn);
            });
        } else {
            episodesSection.classList.add('hidden');
        }
        const playBtn = document.getElementById('detail-play-btn');
        playBtn.onclick = () => {
            this.checkPasswordAndPlay(item.id, 0);
        };
        modal.style.display = 'block';
        document.body.style.overflow = 'hidden';
    },
    closeDetailModal() {
        const modal = document.getElementById('detail-modal');
        modal.style.display = 'none';
        document.body.style.overflow = 'auto';
        this.state.currentDetailItem = null;
    },
    checkPasswordAndPlay(id, episodeIndex) {
        const item = this.state.data.find(i => i.id === id);
        if (!item) return;
        if (!item.needPassword) {
            this.closeDetailModal();
            this.playVideo(id, episodeIndex);
            return;
        }
        const inputPwd = prompt(`该影视需要播放密码，请输入密码：`);
        if (inputPwd === null) return;
        if (inputPwd.trim() === item.playPassword) {
            this.closeDetailModal();
            this.playVideo(id, episodeIndex);
        } else {
            alert('密码错误，无法播放！');
        }
    },
    playHeroVideo() {
        if (this.state.currentHeroId) {
            this.checkPasswordAndPlay(this.state.currentHeroId, 0);
        }
    },
    showHeroDetails() {
        if (this.state.currentHeroId) {
            this.openDetailModal(this.state.currentHeroId);
        }
    },
    setFilter(filter) {
        this.state.currentFilter = filter;
        this.state.subCategory = '';
        // 切换顶部导航，重置所有版块页码为1
        Object.keys(this.state.pageMap).forEach(key=>{
            this.state.pageMap[key]=1;
        });
        document.querySelectorAll('.sub-category-select').forEach(sel=>sel.value='');
        document.querySelectorAll('.nav-btn').forEach(btn => {
            if (btn.dataset.filter === filter) {
                btn.classList.remove('text-gray-300', 'bg-transparent');
                btn.classList.add('text-blue-400', 'font-semibold', 'bg-gray-600/50');
            } else {
                btn.classList.add('text-gray-300');
                btn.classList.remove('text-blue-400', 'font-semibold', 'bg-gray-600/50');
            }
        });
        this.renderMultiSection();
    },
    setSubCategory(subCat){
        this.state.subCategory = subCat;
        // 切换二级分类，重置全部版块页码
        Object.keys(this.state.pageMap).forEach(key=>{
            this.state.pageMap[key]=1;
        });
        this.renderMultiSection();
    },
    resetFilter() {
        this.setFilter('all');
        document.getElementById('search-input').value = '';
        this.state.searchQuery = '';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    },
    setSort(sortBy) {
        this.state.sortBy = sortBy;
        // 切换排序重置所有分页
        Object.keys(this.state.pageMap).forEach(key=>{
            this.state.pageMap[key]=1;
        });
        this.renderMultiSection();
    },
    bindEvents() {
        const searchInput = document.getElementById('search-input');
        if (searchInput) {
            searchInput.addEventListener('input', (e) => {
                this.state.searchQuery = e.target.value;
                // 搜索重置所有分页
                Object.keys(this.state.pageMap).forEach(key=>{
                    this.state.pageMap[key]=1;
                });
                this.renderMultiSection();
            });
        }
        const subSelects = document.querySelectorAll('.sub-category-select');
        subSelects.forEach(sel=>{
            sel.addEventListener('change',(e)=>{
                this.setSubCategory(e.target.value);
            })
        })
    },
    formatNumber(num) {
        if (num >= 10000) return (num / 10000).toFixed(1) + '万';
        return num;
    },
    playVideo(id, episodeIndex = 0) {
        const item = this.state.data.find(i => i.id === id);
        if (!item) return;
        this.state.currentPlayingItem = item;
        const playerContainer = document.getElementById('player-modal');
        const player = document.getElementById('main-player');
        const titleEl = document.getElementById('player-title');
        const episodeInfoEl = document.getElementById('player-episode-info');
        const prevBtn = document.getElementById('prev-ep-btn');
        const nextBtn = document.getElementById('next-ep-btn');
        playerContainer.style.display = 'flex';
        titleEl.innerText = item.title;
        if (this.state.hlsInstance) {
            this.state.hlsInstance.destroy();
            this.state.hlsInstance = null;
        }
        if (item.mainType === 'tv' || item.mainType === 'variety' || item.mainType === 'anime') {
            this.state.episodeList = item.episodeUrls;
            if (episodeIndex >= this.state.episodeList.length) {
                episodeIndex = 0;
            }
            this.state.currentEpisodeIndex = episodeIndex;
            this.loadEpisode(this.state.currentEpisodeIndex);
            prevBtn.style.display = 'flex';
            nextBtn.style.display = 'flex';
            this.updateNavButtonsState();
        } else {
            episodeInfoEl.innerText = `${item.duration || '直播/影片'}`;
            this.loadSource(player, item.videoUrl);
            prevBtn.style.display = 'none';
            nextBtn.style.display = 'none';
        }
    },
    loadEpisode(index) {
        if (!this.state.episodeList || index < 0 || index >= this.state.episodeList.length) return;
        this.state.currentEpisodeIndex = index;
        const url = this.state.episodeList[index];
        const player = document.getElementById('main-player');
        this.loadSource(player, url);
        this.updateEpisodeInfo();
        this.updateNavButtonsState();
    },
    updateEpisodeInfo() {
        const episodeInfoEl = document.getElementById('player-episode-info');
        const currentEp = this.state.currentEpisodeIndex + 1;
        const totalEp = this.state.episodeList.length;
        episodeInfoEl.innerText = `第 ${currentEp} 集 / 共 ${totalEp} 集`;
    },
    updateNavButtonsState() {
        const prevBtn = document.getElementById('prev-ep-btn');
        const nextBtn = document.getElementById('next-ep-btn');
        if (this.state.currentEpisodeIndex <= 0) {
            prevBtn.classList.add('opacity-50', 'cursor-not-allowed');
        } else {
            prevBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        }
        if (this.state.currentEpisodeIndex >= this.state.episodeList.length - 1) {
            nextBtn.classList.add('opacity-50', 'cursor-not-allowed');
        } else {
            nextBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        }
    },
    loadSource(player, url) {
        if (this.state.hlsInstance) {
            this.state.hlsInstance.destroy();
            this.state.hlsInstance = null;
        }
        /* ---- 每次加载新源时重置跑马灯 & 广告插播状态 ---- */
        this.resetMarquee();
        this.resetAds();
        player.ontimeupdate = () => this.onMainPlayerTimeUpdate();
        player.onplay = () => {
            // 开播时首次滚动（仅一次；全屏时同样仅按时间点触发）
            if (!this.state.marqueeInitialShown) {
                this.state.marqueeInitialShown = true;
                this.triggerMarquee();
            }
        };
        if (Hls.isSupported()) {
            const hls = new Hls({
                maxBufferLength: 30,
                maxMaxBufferLength: 60
            });
            hls.loadSource(url);
            hls.attachMedia(player);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                player.play().catch(e => console.log('自动播放被浏览器拦截:', e));
            });
            this.state.hlsInstance = hls;
        } else if (player.canPlayType('application/vnd.apple.mpegurl')) {
            player.src = url;
            player.play().catch(e => console.log('自动播放被浏览器拦截:', e));
        }
    },
    closePlayer() {
        const playerContainer = document.getElementById('player-modal');
        const player = document.getElementById('main-player');
        if (this.state.hlsInstance) {
            this.state.hlsInstance.destroy();
            this.state.hlsInstance = null;
        }
        player.pause();
        player.src = '';
        player.removeAttribute('src');
        player.load();
        playerContainer.style.display = 'none';
        this.state.currentPlayingItem = null;
        this.state.episodeList = [];
        this.state.currentEpisodeIndex = 0;
        /* 关闭播放器时也清理跑马灯/广告监听与状态 */
        player.ontimeupdate = null;
        player.onplay = null;
        this.resetMarquee();
        this.resetAds();
    },
    toggleFullScreen() {
        const playerContainer = document.querySelector('#player-modal > div');
        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
            if (playerContainer.requestFullscreen) {
                playerContainer.requestFullscreen();
            } else if (playerContainer.webkitRequestFullscreen) {
                playerContainer.webkitRequestFullscreen();
            }
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            }
        }
    }
};
document.addEventListener('DOMContentLoaded', () => {
    app.init();
});
</script>
</body>
</html>

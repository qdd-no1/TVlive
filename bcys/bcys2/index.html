
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>光影视界 - 在线影视平台</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- HLS.js for m3u8 support -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        /* 自定义滚动条 */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1a202c; }
        ::-webkit-scrollbar-thumb { background: #4a5568; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #718096; }
        
        /* 英雄区背景渐变 */
        .hero-bg {
            background: linear-gradient(to bottom, rgba(0,0,0,0.3), rgba(0,0,0,0.9)), url('https://picsum.photos/1920/1080?random=1');
            background-size: cover;
            background-position: center;
        }
        
        /* 卡片悬停效果 */
        .movie-card { transition: transform 0.3s ease, box-shadow 0.3s ease; }
        .movie-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        
        /* 播放按钮动画 */
        .play-btn { transition: all 0.3s ease; }
        .play-btn:hover { transform: scale(1.1); color: #e53e3e; }
    </style>
</head>
<body class="bg-gray-900 text-white font-sans antialiased min-h-screen flex flex-col">

    <!-- 导航栏 -->
    <nav class="bg-gray-800 bg-opacity-90 backdrop-blur-md fixed w-full z-50 top-0 border-b border-gray-700">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2 cursor-pointer" onclick="app.goHome()">
                <i class="fas fa-film text-red-500 text-2xl"></i>
                <span class="text-xl font-bold tracking-wider">光影视界</span>
            </div>
            <div class="hidden md:flex space-x-6">
                <a href="#" onclick="app.filterType('all')" class="hover:text-red-400 transition">首页</a>
                <a href="#" onclick="app.filterType('movie')" class="hover:text-red-400 transition">电影</a>
                <a href="#" onclick="app.filterType('tv')" class="hover:text-red-400 transition">电视剧</a>
            </div>
            <div class="relative">
                <input type="text" id="searchInput" placeholder="搜索影视..." class="bg-gray-700 text-sm rounded-full pl-4 pr-10 py-2 focus:outline-none focus:ring-2 focus:ring-red-500 w-48 transition-all">
                <button onclick="app.handleSearch()" class="absolute right-3 top-2 text-gray-400 hover:text-white">
                    <i class="fas fa-search"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <main class="flex-grow pt-16">
        
        <!-- 英雄栏 (Hero Section) -->
        <section id="heroSection" class="hero-bg h-[500px] flex items-center relative overflow-hidden">
            <div class="container mx-auto px-4 relative z-10">
                <div class="max-w-2xl animate-fade-in-up">
                    <span class="bg-red-600 text-xs font-bold px-2 py-1 rounded uppercase tracking-wide mb-2 inline-block">热门推荐</span>
                    <h1 id="heroTitle" class="text-5xl font-extrabold mb-4 leading-tight">加载中...</h1>
                    <p id="heroDesc" class="text-gray-300 text-lg mb-6 line-clamp-3">正在获取最新推荐内容...</p>
                    <div class="flex space-x-4">
                        <button onclick="app.playHero()" class="bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-8 rounded-full flex items-center transition shadow-lg">
                            <i class="fas fa-play mr-2"></i> 立即播放
                        </button>
                        <button onclick="app.showDetails(app.state.currentHeroId)" class="bg-gray-700 hover:bg-gray-600 text-white font-bold py-3 px-8 rounded-full flex items-center transition">
                            <i class="fas fa-info-circle mr-2"></i> 更多详情
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- 筛选与排序 -->
        <section class="container mx-auto px-4 py-8">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold border-l-4 border-red-500 pl-3">最新上映</h2>
                <div class="flex space-x-2">
                    <select id="sortSelect" onchange="app.handleSort()" class="bg-gray-800 border border-gray-700 text-sm rounded-lg p-2 focus:ring-red-500 focus:border-red-500">
                        <option value="newest">最新上映</option>
                        <option value="rating">最高评分</option>
                        <option value="views">最多观看</option>
                    </select>
                </div>
            </div>

            <!-- 影视卡片网格 -->
            <div id="movieGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6">
                <!-- 动态生成内容 -->
            </div>

            <!-- 分页控件 -->
            <div class="mt-10 flex justify-center space-x-2" id="pagination">
                <!-- 动态生成分页 -->
            </div>
        </section>
    </main>

    <!-- 页脚 -->
    <footer class="bg-gray-800 border-t border-gray-700 py-8 mt-auto">
        <div class="container mx-auto px-4 text-center text-gray-400">
            <p>&copy; 2026 光影视界. All rights reserved.</p>
            <div class="mt-2 space-x-4 text-sm">
                <a href="#" class="hover:text-white">关于我们</a>
                <a href="#" class="hover:text-white">免责声明</a>
                <a href="#" class="hover:text-white">联系方式</a>
            </div>
        </div>
    </footer>

    <!-- 详情模态框 -->
    <div id="detailModal" class="fixed inset-0 z-50 hidden overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <div class="fixed inset-0 bg-gray-900 bg-opacity-75 transition-opacity" aria-hidden="true" onclick="app.closeModal()"></div>
            <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
            <div class="inline-block align-bottom bg-gray-800 rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-4xl sm:w-full border border-gray-700">
                
                <!-- 模态框头部背景 -->
                <div class="relative h-64 sm:h-80">
                    <img id="modalBackdrop" src="" alt="Backdrop" class="w-full h-full object-cover opacity-60">
                    <div class="absolute bottom-0 left-0 p-6 w-full bg-gradient-to-t from-gray-800 to-transparent">
                        <h2 id="modalTitle" class="text-3xl font-bold text-white mb-2"></h2>
                        <div class="flex items-center space-x-4 text-sm text-gray-300">
                            <span id="modalYear"></span>
                            <span class="border border-gray-500 px-1 rounded">HD</span>
                            <span id="modalRating" class="text-yellow-400"><i class="fas fa-star"></i> </span>
                            <span id="modalType" class="bg-red-600 text-white px-2 py-0.5 rounded text-xs"></span>
                        </div>
                    </div>
                    <button onclick="app.closeModal()" class="absolute top-4 right-4 text-gray-300 hover:text-white bg-black bg-opacity-50 rounded-full p-2 w-10 h-10 flex items-center justify-center">
                        <i class="fas fa-times"></i>
                    </button>
                </div>

                <!-- 模态框内容 -->
                <div class="px-6 py-6">
                    <div class="flex flex-col md:flex-row gap-6">
                        <!-- 左侧海报 -->
                        <div class="w-full md:w-1/3 flex-shrink-0">
                            <img id="modalPoster" src="" alt="Poster" class="w-full rounded-lg shadow-lg border border-gray-700">
                            <button id="mainPlayBtn" class="w-full mt-4 bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-4 rounded-lg flex items-center justify-center transition">
                                <i class="fas fa-play mr-2"></i> 开始播放
                            </button>
                        </div>
                        
                        <!-- 右侧信息 -->
                        <div class="w-full md:w-2/3">
                            <h3 class="text-xl font-semibold mb-2 text-gray-200">剧情简介</h3>
                            <p id="modalPlot" class="text-gray-400 mb-6 leading-relaxed"></p>
                            
                            <h3 class="text-xl font-semibold mb-2 text-gray-200">主演阵容</h3>
                            <p id="modalCast" class="text-gray-400 mb-6"></p>

                            <!-- 电视剧分集列表 (仅电视剧显示) -->
                            <div id="episodeSection" class="hidden">
                                <h3 class="text-xl font-semibold mb-3 text-gray-200">选集播放</h3>
                                <div id="episodeList" class="grid grid-cols-4 sm:grid-cols-6 gap-2 max-h-40 overflow-y-auto pr-2">
                                    <!-- 动态生成集数按钮 -->
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 播放器模态框 (默认隐藏) -->
    <div id="playerModal" class="fixed inset-0 z-50 bg-black flex flex-col hidden">
        <div class="flex justify-between items-center p-4 bg-gray-900 border-b border-gray-800">
            <div class="flex items-center space-x-4">
                <button onclick="app.closePlayer()" class="text-gray-400 hover:text-white mr-4 flex items-center">
                    <i class="fas fa-arrow-left mr-2"></i> 返回
                </button>
                <h3 id="playerTitle" class="text-white font-bold truncate pr-4">正在播放</h3>
            </div>
            <div class="flex items-center space-x-4">
                 <button id="prevEpBtn" onclick="app.playPrevEpisode()" class="text-gray-400 hover:text-white hidden"><i class="fas fa-step-backward"></i> 上一集</button>
                 <button id="nextEpBtn" onclick="app.playNextEpisode()" class="text-gray-400 hover:text-white hidden">下一集 <i class="fas fa-step-forward"></i></button>
                <button onclick="app.closePlayer()" class="text-gray-400 hover:text-white ml-4">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
        </div>
        <div class="flex-grow flex items-center justify-center bg-black relative group">
            <video id="videoPlayer" controls class="w-full h-full max-h-[80vh]" poster="">
                您的浏览器不支持 HTML5 video 标签。
            </video>
            <!-- 模拟加载或错误提示 -->
            <div id="playerOverlay" class="absolute inset-0 flex items-center justify-center bg-black bg-opacity-80 hidden">
                <div class="text-center">
                    <i class="fas fa-spinner fa-spin text-4xl text-red-500 mb-4"></i>
                    <p class="text-gray-300">正在加载资源...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
